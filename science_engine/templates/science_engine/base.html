{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Science Calculator & Theory Engine</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&display=swap" rel="stylesheet">
    <!-- Tailwind CSS (with Typography plugin) -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <!-- 3D Force Graph -->
    <script src="https://unpkg.com/3d-force-graph"></script>
    <!-- MathJax for rendering LaTeX mathematical physics formulas -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
            }
        };
    </script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sci: {
                            base: '#0f172a',    // Slate 900
                            surface: '#1e293b', // Slate 800
                            highlight: '#38bdf8', // Sky 400
                            accent: '#2dd4bf',    // Teal 400
                            text: '#e2e8f0',      // Slate 200
                            muted: '#94a3b8',     // Slate 400
                            danger: '#fb7185',    // Rose 400
                            success: '#4ade80',   // Green 400
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui'],
                        serif: ['Merriweather', 'ui-serif', 'Georgia', 'serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', "Liberation Mono", "Courier New", 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Scrollbar */
        * {
            scrollbar-width: thin;
            scrollbar-color: #334155 #0f172a;
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-sci-base text-sci-text font-sans h-screen flex flex-col overflow-hidden selection:bg-sci-highlight selection:text-sci-base">

    <!-- Navbar -->
    <nav class="bg-sci-surface border-b border-slate-700 h-16 flex items-center px-6 shadow-md z-10 shrink-0">
        <div class="flex items-center gap-2 mr-10">
            <svg class="w-8 h-8 text-sci-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
            <span class="text-xl font-bold tracking-wider text-white">SCICALC<span class="text-sci-accent text-sm ml-1 font-normal opacity-80">v1.0</span></span>
        </div>
        
        <div class="flex gap-1">
            <a href="{% url 'index' %}" class="px-4 py-2 rounded-md transition-colors duration-200 hover:bg-slate-700 hover:text-white {% if request.resolver_match.url_name == 'index' %}bg-slate-700 text-sci-highlight font-medium{% else %}text-sci-muted{% endif %}">
                Dashboard
            </a>
            <a href="{% url 'theory_list' %}" class="px-4 py-2 rounded-md transition-colors duration-200 hover:bg-slate-700 hover:text-white {% if 'theory' in request.resolver_match.url_name %}bg-slate-700 text-sci-highlight font-medium{% else %}text-sci-muted{% endif %}">
                Theory Library
            </a>
            <a href="{% url 'knowledge_base' %}" class="px-4 py-2 rounded-md transition-colors duration-200 hover:bg-slate-700 hover:text-white {% if 'knowledge' in request.resolver_match.url_name %}bg-slate-700 text-sci-highlight font-medium{% else %}text-sci-muted{% endif %}">
                Knowledge Base
            </a>
            <a href="{% url 'space_flight' %}" class="px-4 py-2 rounded-md transition-colors duration-200 hover:bg-slate-700 hover:text-white {% if 'space_flight' in request.resolver_match.url_name %}bg-slate-700 text-sky-400 font-medium{% else %}text-sci-muted{% endif %}">
                Space Flight
            </a>
            <a href="{% url 'gap_analysis' %}" class="px-4 py-2 rounded-md transition-colors duration-200 hover:bg-slate-700 hover:text-white {% if 'gap' in request.resolver_match.url_name %}bg-slate-700 text-sci-highlight font-medium{% else %}text-sci-muted{% endif %}">
                Gap Resolution
            </a>
            <a href="{% url 'oracle_engine' %}" class="px-4 py-2 rounded-md transition-colors duration-200 hover:bg-slate-700 hover:text-white {% if 'oracle' in request.resolver_match.url_name %}bg-slate-700 text-purple-400 font-medium{% else %}text-purple-400{% endif %}">
                Oracle
            </a>
        </div>
        
        <div class="ml-auto text-xs text-sci-muted font-mono">
            System: <span class="text-green-500">ONLINE</span>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="flex-1 flex overflow-hidden relative">
        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
